<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3efe5"><meta name="description" content="주소가 바뀌었거나 아직 공개하지 않은 글일 수 있습니다."><title>없는 페이지 | 권병준 Notes</title><meta property="og:type" content="website"><meta property="og:site_name" content="권병준 Notes"><meta property="og:title" content="없는 페이지"><meta property="og:description" content="주소가 바뀌었거나 아직 공개하지 않은 글일 수 있습니다."><meta property="og:locale" content="ko_KR"><meta name="twitter:card" content="summary"><link rel="icon" href="/notes/favicon.svg?v=2" type="image/svg+xml"><link rel="stylesheet" href="/notes/_astro/NotesLayout.PjJ7CnqV.css"></head><body class="resume-page"><a class="skip-link" href="#main">본문으로 건너뛰기</a><header class="site-header"><a class="brand" href="/" aria-label="권병준 이력서로 이동"><span class="brand-mark">FE</span><span>권병준 <small>FRONTEND DEVELOPER</small></span></a><div class="resume-actions"><a href="/" data-umami-event="notes-to-profile">이력서 <span aria-hidden="true">&nearr;</span></a><a class="resume-notes" href="/notes/">Notes</a><button type="button" data-search-open hidden data-umami-event="notes-search-open">검색</button></div></header><main id="main" class="resume-shell"><article class="resume-document"><div class="resume-intro"><span class="eyebrow">404</span><h1>없는 페이지<span>.</span></h1><p>주소가 바뀌었거나 아직 공개하지 않은 글일 수 있습니다.</p></div><a class="note-feed-link" href="/notes/">Notes 피드로 가기</a></article></main><footer class="footer small-footer"><div class="footer-bottom"><div class="footer-meta"><span>&copy; 2026 권병준 &middot; NOTES</span></div><a href="#main">BACK TO TOP &uarr;</a></div></footer><dialog class="notes-search" aria-labelledby="notes-search-label" data-search-dialog><div class="notes-search-inner"><div class="notes-search-head"><label class="eyebrow" id="notes-search-label" for="notes-search-input">NOTES 검색</label><button type="button" data-search-close>닫기</button></div><input id="notes-search-input" type="text" enterkeyhint="search" autocomplete="off" spellcheck="false" data-search-input><p class="notes-search-status" aria-live="polite" data-search-status></p><ul class="notes-search-results" data-search-results></ul></div></dialog><script type="module">
  // is:inline keeps Vite away from this import: the index only exists after astro build, and a
  // Vite-processed script that Astro inlines leaves __VITE_PRELOAD__ undefined at runtime.
  const pagefindUrl = '/notes/pagefind/pagefind.js';
  const maxResults = 10;

  const openButton = document.querySelector('[data-search-open]');
  const dialog = document.querySelector('[data-search-dialog]');

  if (openButton && dialog) {
    const input = dialog.querySelector('[data-search-input]');
    const status = dialog.querySelector('[data-search-status]');
    const list = dialog.querySelector('[data-search-results]');
    let pagefindPromise;

    const loadPagefind = () => {
      pagefindPromise ??= import(pagefindUrl).then(async (pagefind) => {
        await pagefind.options({ baseUrl: '/notes/' });
        return pagefind;
      });
      return pagefindPromise;
    };

    const render = (results) => {
      list.replaceChildren(
        ...results.map(({ url, excerpt, meta }) => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = url;
          const title = document.createElement('strong');
          title.textContent = meta.title ?? url;
          const text = document.createElement('p');
          // Pagefind escapes the page text and only adds <mark> around matches.
          text.innerHTML = excerpt;
          link.append(title, text);
          item.append(link);
          return item;
        }),
      );
    };

    const search = async () => {
      const term = input.value.trim();
      let pagefind;
      try {
        pagefind = await loadPagefind();
      } catch {
        pagefindPromise = undefined;
        status.textContent = '검색 기능을 불러오지 못했습니다.';
        return;
      }
      const response = await pagefind.debouncedSearch(term, {}, 200);
      // null means a newer keystroke replaced this search.
      if (response === null) return;
      if (!term) {
        status.textContent = '';
        render([]);
        return;
      }
      const results = await Promise.all(response.results.slice(0, maxResults).map((result) => result.data()));
      if (input.value.trim() !== term) return;
      status.textContent = results.length === 0 ? '검색 결과가 없습니다.' : '';
      render(results);
    };

    openButton.hidden = false;
    openButton.addEventListener('click', () => {
      dialog.showModal();
      input.focus();
      input.select();
      loadPagefind().catch(() => {});
    });
    dialog.querySelector('[data-search-close]').addEventListener('click', () => dialog.close());
    // Clicks on the backdrop land on the dialog itself; the inner wrapper covers the visible box.
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) dialog.close();
    });
    dialog.addEventListener('close', () => openButton.focus());
    input.addEventListener('input', search);
  }
</script></body></html>
